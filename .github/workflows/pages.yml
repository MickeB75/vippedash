name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version into js/version.js
        env:
          TZ: Europe/Stockholm
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          sys.path.insert(0, 'tools')
          from build_single import compute_version, stamp_version
          version = compute_version()
          p = pathlib.Path('js/version.js')
          p.write_text(stamp_version(p.read_text(encoding='utf-8'), version), encoding='utf-8')
          print('Version: ' + version)
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
