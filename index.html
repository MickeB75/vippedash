<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c1024">
<title>VippeDash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='50' rx='9' fill='%23d3122f'/%3E%3Crect x='14' y='22' width='36' height='32' rx='7' fill='%23f2c6a0'/%3E%3Cg fill='%236b4526'%3E%3Ccircle cx='14' cy='15' r='9'/%3E%3Ccircle cx='26' cy='9' r='9'/%3E%3Ccircle cx='38' cy='9' r='9'/%3E%3Ccircle cx='50' cy='15' r='9'/%3E%3Ccircle cx='32' cy='19' r='8'/%3E%3C/g%3E%3Ccircle cx='25' cy='36' r='5' fill='white'/%3E%3Ccircle cx='39' cy='36' r='5' fill='white'/%3E%3Ccircle cx='26' cy='37' r='2.5' fill='%233d6f95'/%3E%3Ccircle cx='40' cy='37' r='2.5' fill='%233d6f95'/%3E%3Cpath d='M22 45h20q-2 7-10 7t-10-7z' fill='%235b1212'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" aria-label="VippeDash game"></canvas>

    <div id="menu" class="overlay">
      <div class="panel">
        <h1 class="logo"><span class="a">Vippe</span><span class="b">Dash</span></h1>
        <div class="menubody">
          <div class="herobox">
            <canvas id="hero" width="240" height="260"></canvas>
            <p id="skinName" class="skinname"></p>
            <button id="shopBtn" class="btn shopbtn">🛒&nbsp; Shop</button>
          </div>
          <div class="levelbox">
            <p class="pick">Choose a level</p>
            <div id="levels" class="levels"></div>
          </div>
        </div>
        <button id="play" class="btn big">▶&nbsp; PLAY</button>
        <p class="help">Jump / fly / flip: <b>Space</b>, <b>↑</b>, <b>click</b> or <b>tap</b> &nbsp;·&nbsp; Pause: <b>Esc</b> &nbsp;·&nbsp; Mute: <b>M</b></p>
      </div>
      <div class="wallet corner" title="Your coins"><i class="coin"></i><span id="coinsMenu">0</span></div>
      <p id="version" class="version"></p>
    </div>

    <div id="shop" class="overlay hidden">
      <div class="panel shoppanel">
        <div class="shophead">
          <h2>Shop</h2>
          <div id="shopTabs" class="shoptabs"></div>
          <div class="wallet" title="Your coins"><i class="coin"></i><span id="coinsShop">0</span></div>
        </div>
        <p class="sub">Win coins by finishing levels. Harder levels and fewer crashes give more coins!</p>
        <div id="shopGrid" class="shopgrid"></div>
        <button id="shopBack" class="btn">←&nbsp; Back</button>
      </div>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="panel small">
        <h2>Paused</h2>
        <button id="resume" class="btn big">▶&nbsp; Resume</button>
        <button id="restart" class="btn">↺&nbsp; Restart from the beginning</button>
        <button id="strobeBtn" class="btn hidden">⚡&nbsp; Strobe: On</button>
        <button id="menuBtn" class="btn">Main menu</button>
      </div>
    </div>

    <div id="win" class="overlay hidden">
      <div class="panel">
        <h2 id="winTitle" class="wintitle"></h2>
        <p id="winSub" class="sub"></p>
        <div id="stats" class="stats"></div>
        <div id="reward" class="reward"></div>
        <button id="next" class="btn big">▶&nbsp; Next level</button>
        <button id="again" class="btn">↺&nbsp; Play again</button>
        <button id="winMenu" class="btn">Main menu</button>
      </div>
    </div>

    <div id="gameover" class="overlay hidden">
      <div class="panel small gameover">
        <h2 class="gotitle">DU DOG!</h2>
        <p id="goSub" class="sub"></p>
        <button id="goRestart" class="btn big">↺&nbsp; Start over from the start</button>
        <button id="goMenu" class="btn">Main menu</button>
      </div>
    </div>

    <button id="mute" class="mute" aria-label="Toggle sound">🔊</button>
  </div>
</div>

<div id="rotate">
  <div class="phone">📱</div>
  <p>Vänd mobilen!</p>
  <p class="sub">VippeDash is played in landscape</p>
</div>

<script src="js/util.js"></script>
<script src="js/version.js"></script>
<script src="js/physics.js"></script>
<script src="js/level.js"></script>
<script src="js/solver.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/horror.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/mobile.js"></script>
<script>
  // offline support for the installed app; skipped when opened as a file
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
